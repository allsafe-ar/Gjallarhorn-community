name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: node --check server.js
      # ⚠️ Sin `|| true`: informaba y no frenaba nada. Los backends quedaron en cero el
      # 2026-09-21, asi que a partir de ahora una dependencia vulnerable frena el build.
      - name: Vulnerabilidades en dependencias de produccion (alta o critica)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # `build` corre `tsc -b` antes de vite, asi que esto tambien chequea tipos.
      - name: Build con chequeo de tipos
        run: npm run build
